name: link-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  link-check:
    name: link-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: chohan-sarmad-ali/delivery-gates/link-check@v1
        with:
          root: "."
