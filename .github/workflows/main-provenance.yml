name: main-provenance

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  main-provenance:
    name: main-provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reject non-merge commits on main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/ci/audit_provenance.py \
            --before "${{ github.event.before }}" \
            --after "${{ github.event.after }}"
