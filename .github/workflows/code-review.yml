name: code-review

# pull_request_target keeps the model secret away from PR-controlled code:
# the workflow file and the review script come from the base branch, and the
# PR head is only fetched to build a diff. No file from the PR is executed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review-agent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Advisory by design (ADR-0003): this job must never block a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI and Agent SDK
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install claude-agent-sdk

      - name: Build pull-request diff (read-only)
        run: |
          git fetch origin "+refs/heads/*:refs/remotes/origin/*" --prune
          git fetch origin "pull/${{ github.event.pull_request.number }}/head:pr-head"
          git diff "origin/${{ github.event.pull_request.base.ref }}...pr-head" > /tmp/pr.diff
          wc -c /tmp/pr.diff

      - name: Review
        env:
          # OpenCode Zen Go transport (preferred when configured).
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          OPENCODE_BASE_URL: ${{ vars.OPENCODE_BASE_URL || 'https://opencode.ai/inference/go/openai/v1' }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'deepseek-v4.1-flash' }}
          OPENCODE_MAX_TOKENS: ${{ vars.OPENCODE_MAX_TOKENS || '64000' }}
          # Claude Agent SDK transport (fallback).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_DIFF_PATH: /tmp/pr.diff
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'claude-sonnet-5-5' }}
        run: python scripts/ci/review_agent.py
