name: issue-gate

on:
  pull_request:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: issue-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  issue-gate:
    name: issue-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require resolved issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ci/issue_gate.py
