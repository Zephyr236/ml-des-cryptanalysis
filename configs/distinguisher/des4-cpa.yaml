# Stage 1 neural distinguisher: 4-round DES, CPA.
# Rounds: Feistel rounds actually executed (final swap included).
# Mode: chosen-plaintext pairs sharing delta.
run_name: des4-cpa
rounds: 4
mode: cpa
delta: 0x0000000000000001

model:
  name: pair_cnn
  channels: 64
  blocks: 4
  dropout: 0.1

train:
  batch_size: 512
  steps: 3000
  lr: 0.001
  weight_decay: 0.01
  log_every: 50
  eval_every: 250
  eval_batches: 32
  seed: 0
  device: auto

data:
  negative_fraction: 0.5
