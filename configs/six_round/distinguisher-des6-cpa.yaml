# 6-round neural distinguisher (CPA) with the 5-round trail difference.
run_name: distinguisher-des6-cpa
rounds: 6
mode: cpa
delta: 0x0000001010000000

model:
  name: pair_cnn
  channels: 64
  blocks: 4
  dropout: 0.1

train:
  batch_size: 512
  steps: 4000
  lr: 0.001
  weight_decay: 0.01
  log_every: 50
  eval_every: 250
  eval_batches: 32
  seed: 0
  device: auto

data:
  negative_fraction: 0.5
